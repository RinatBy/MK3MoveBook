log_format movebook_no_args
    '$remote_addr - $remote_user [$time_local] '
    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
    '"$http_referer" "$http_user_agent"';

limit_req_zone $binary_remote_addr zone=movebook_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=movebook_poll:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=movebook_api:10m rate=120r/m;

server {
    listen 80;
    listen [::]:80;
    server_name api.movebook.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.movebook.ru;

    ssl_certificate /etc/letsencrypt/live/api.movebook.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.movebook.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MoveBookTLS:10m;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/movebook-api.access.log movebook_no_args;
    error_log /var/log/nginx/movebook-api.error.log warn;
    client_max_body_size 64k;
    limit_req_status 429;
    proxy_headers_hash_max_size 1024;
    proxy_headers_hash_bucket_size 128;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /api/v1/auth/device-sessions {
        limit_req zone=movebook_login burst=5 nodelay;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://127.0.0.1:8020;
    }

    location = /api/v1/auth/device-sessions/token {
        limit_req zone=movebook_poll burst=20 nodelay;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://127.0.0.1:8020;
    }

    location ~ /\. {
        access_log off;
        return 404;
    }

    location / {
        limit_req zone=movebook_api burst=30 nodelay;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_pass http://127.0.0.1:8020;
    }
}
